name: Supabase keep-alive

# Prevents the Supabase free-tier project from pausing after ~7 days of
# inactivity (which would break logged-in chat/document persistence until a
# manual restore). Guests are unaffected because LexInsights defaults to local
# providerless mode, but this keeps the authenticated path warm at $0.
#
# Setup: add two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the public anon/publishable key (already shipped client-side)
# Missing secrets, DNS failures, and non-2xx responses fail the workflow so an
# outage cannot be reported as a successful keep-alive.

on:
  schedule:
    # Daily at 06:17 UTC. A PostgREST request exercises the database API.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Reach Supabase database API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/run-supabase-keepalive.mjs
